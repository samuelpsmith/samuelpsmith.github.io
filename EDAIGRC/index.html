<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Conference materials from Sam Smith for the EDAI Gordon Research Conference."
        />
        <title>EDAI GRC | Sam Smith</title>
        <link rel="canonical" href="https://samuelpsmith.org/EDAIGRC/" />
        <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&amp;family=Open+Sans:wght@400;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --ink: #17343a;
                --muted: #587178;
                --paper: #f5f1e8;
                --teal: #00798c;
                --red: #d1495b;
                --rule: rgba(23, 52, 58, 0.16);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                min-height: 100%;
            }

            body {
                margin: 0;
                color: var(--ink);
                background:
                    radial-gradient(circle at 12% 18%, rgba(0, 121, 140, 0.09), transparent 28rem),
                    radial-gradient(circle at 88% 82%, rgba(209, 73, 91, 0.08), transparent 30rem),
                    var(--paper);
                font-family: "Open Sans", sans-serif;
            }

            .page {
                width: min(72rem, calc(100% - 2.5rem));
                min-height: 100vh;
                margin: 0 auto;
                display: grid;
                grid-template-rows: auto 1fr auto;
            }

            .site-header,
            .site-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 1.5rem 0;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .site-header {
                border-bottom: 1px solid var(--rule);
            }

            .site-header a {
                color: inherit;
                text-decoration: none;
            }

            .conference-label {
                color: var(--teal);
            }

            main {
                display: grid;
                place-items: center;
                padding: 5rem 0;
            }

            .hero {
                width: min(46rem, 100%);
                text-align: center;
                animation: arrive 700ms ease-out both;
            }

            .eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 0.65rem;
                margin-bottom: 1.5rem;
                color: var(--muted);
                font-size: 0.74rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .eyebrow::before {
                width: 0.55rem;
                height: 0.55rem;
                border-radius: 50%;
                background: var(--red);
                box-shadow: 0 0 0 0.3rem rgba(209, 73, 91, 0.12);
                content: "";
            }

            h1 {
                max-width: 12ch;
                margin: 0 auto;
                font-family: "Lora", serif;
                font-size: clamp(3rem, 9vw, 6.5rem);
                font-weight: 600;
                letter-spacing: -0.055em;
                line-height: 0.98;
            }

            .description {
                max-width: 38rem;
                margin: 2rem auto 0;
                color: var(--muted);
                font-size: clamp(1rem, 2vw, 1.2rem);
                line-height: 1.75;
            }

            .signal {
                width: min(36rem, 92%);
                margin: 3.5rem auto 0;
            }

            .signal svg {
                display: block;
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .signal path {
                fill: none;
                stroke-linecap: round;
            }

            .site-footer {
                border-top: 1px solid var(--rule);
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: none;
            }

            @keyframes arrive {
                from {
                    opacity: 0;
                    transform: translateY(0.75rem);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 36rem) {
                .page {
                    width: min(100% - 1.5rem, 72rem);
                }

                .site-header,
                .site-footer {
                    padding: 1.1rem 0;
                }

                main {
                    padding: 3.5rem 0;
                }

                .site-footer {
                    align-items: flex-start;
                    flex-direction: column;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .hero {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <a href="../">Sam Smith</a>
                <span class="conference-label">EDAI GRC</span>
            </header>

            <main>
                <section class="hero" aria-labelledby="page-title">
                    <div class="eyebrow">Conference materials</div>
                    <h1 id="page-title">Resources are on the way.</h1>
                    <p class="description">
                        This page will host figures, animations, and supporting material shared at
                        the EDAI Gordon Research Conference. Check back during the conference.
                    </p>

                    <div class="signal" aria-hidden="true">
                        <svg viewBox="0 0 640 112" role="presentation">
                            <path d="M8 56 H632" stroke="#17343a" stroke-opacity="0.16" stroke-width="2" />
                            <path
                                d="M8 56 C92 56 114 20 184 20 C254 20 274 92 344 92 C414 92 434 56 632 56"
                                stroke="#d1495b"
                                stroke-width="5"
                            />
                            <path
                                d="M8 56 C92 56 114 92 184 92 C254 92 274 20 344 20 C414 20 434 56 632 56"
                                stroke="#00798c"
                                stroke-width="5"
                            />
                        </svg>
                    </div>
                </section>
            </main>

            <footer class="site-footer">
                <span>samuelpsmith.org/EDAIGRC</span>
                <span>Placeholder active</span>
            </footer>
        </div>
    </body>
</html>
